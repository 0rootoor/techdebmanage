<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — TechDebt Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bp-navy: #0B2545;
            --bp-blue: #1256A3;
            --bp-blue-light: #2E86DE;
            --bg: #F4F7FB;
            --border: #E3E9F1;
            --ink: #16233B;
            --muted: #64748B;
            --danger: #C0362C;
            --danger-bg: #FBEAE9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(11, 37, 69, 0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--bp-blue) 0%, var(--bp-navy) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 16px;
        }

        .brand-text h1 {
            font-size: 17px;
            font-weight: 700;
            margin: 0;
            color: var(--bp-navy);
        }

        .brand-text p {
            font-size: 12px;
            color: var(--muted);
            margin: 1px 0 0;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            margin-bottom: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--bp-blue-light);
            box-shadow: 0 0 0 3px #EEF4FC;
        }

        button {
            width: 100%;
            background: var(--bp-blue);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: var(--bp-navy);
        }

        .error-box {
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 12.5px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-mark">TD</div>
            <div class="brand-text">
                <h1>TechDebt Manager</h1>
                <p>Connexion requise</p>
            </div>
        </div>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label for="username">Nom</label>
            <input type="text" id="username" name="username" placeholder="Ton nom (pour l'historique)" required />

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />

            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>

</html>
